spring:
  datasource:
    url: jdbc:mysql://localhost:3307/lgb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: user
    password: user
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

jwt:
  secret: local-development-secret-must-be-at-least-32-characters
  expiration-ms: 86400000

cors:
  allowed-origins: http://localhost:3000,http://localhost:8081,http://localhost:19006
